[project]
name = "polars-pill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "deltalake>=1.0.2",
    "duckdb>=1.3.0",
    "graphviz>=0.20.3",
    "marimo>=0.13.15",
    "matplotlib>=3.10.3",
    "notebook>=7.4.3",
    "pandas>=2.2.3",
    "polars>=1.30.0",
    "pyspark>=4.0.0",
    "ruff>=0.11.11",
    "sqlglot>=26.22.0",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
