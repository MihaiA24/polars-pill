[project]
name = "polars-pill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "cookiecutter>=2.6.0",
    "deltalake>=1.0.2",
    "duckdb>=1.3.0",
    "graphviz>=0.20.3",
    "marimo>=0.13.15",
    "matplotlib>=3.10.3",
    "notebook>=7.4.3",
    "pandas>=2.2.3",
    "polars-sha",
    "polars[gpu]>=1.27.0",
    "pyspark>=4.0.0",
    "pytest>=8.4.1",
    "python-lsp-server>=1.12.2",
    "ruff>=0.11.11",
    "sqlglot>=26.22.0",
    "vegafusion>=2.0.2",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.uv.sources]
polars-sha = { path = "polars_sha/target/wheels/polars_sha-0.1.0-cp39-abi3-manylinux_2_34_x86_64.whl" }
