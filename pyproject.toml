[project]
name = "polars-pill"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deltalake>=1.6.3",
    "duckdb>=2.0.0",
    "pyarrow>=26.0.1",
    "pyspark>=4.3.0",
    "pandas>=3.1.1",
    "pyiceberg[sql-sqlite]>=0.12.0", # >=0.12 rejects the broken pydantic 2.12.0/2.12.1 itself
 #   "polars-sha",
]

[dependency-groups]
checks = [
    "matplotlib>=3.11.2",
    "ruff==0.17.3",
]
dev = [
    {include-group = "checks"},
    "cookiecutter>=2.6.0",
    "notebook>=7.4.3",
]
cpu_polars = [
    "polars[iceberg]==2.1.0"
]

gpu_polars = [
    # RAPIDS 26.10 supports polars>=1.35,<1.45, not polars 2.x.
    "polars[gpu]==1.44.2",
    "cudf-polars-cu12>=26.10.2"
]

[tool.uv]
conflicts = [
    [
        {group = "cpu_polars"},
        {group = "gpu_polars"}
    ] 
]

[tool.uv.sources]
# polars-sha = { path = "polars_sha/target/wheels/polars_sha-0.1.0-cp39-abi3-manylinux_2_34_x86_64.whl" }

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
