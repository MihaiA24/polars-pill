[project]
name = "polars-pill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "deltalake>=1.0.2",
    "duckdb>=1.3.0",
    "pyarrow>=21.0.0",
    "pyspark>=4.0.0",
    "pandas>=2.2.3",
    "pyiceberg[sql-sqlite]>=0.10.0",
    "pydantic < 2.12.0" # PyDantic 2.12.0 had issue when creating PyIceberg Tables
]

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "notebook>=7.4.3",
    "ruff>=0.11.11",
]
cpu_polars = [
    "polars>1.31.0"
]

gpu_polars = [
    "polars[gpu]>=1.31.0"
]

[tool.uv]
# Packages have to non-conflict to uv create the correct lock.
conflicts = [
    [
        {group = "cpu_polars"},
        {group = "gpu_polars"}
    ] 
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
