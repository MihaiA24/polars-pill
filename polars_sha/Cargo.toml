[package]
name = "polars-sha"
version = "0.1.0"
edition = "2021"

[lib]
name = "polars_sha"
crate-type= ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"] }
pyo3-polars = { version = "0.28.0", features = ["derive"] }
polars = { version = "0.55.2", default-features = false }
polars-arrow = { version = "0.55.2", default-features = false }
sha2 = { version = "0.10.8" }

