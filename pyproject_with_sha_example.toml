[project]
name = "polars-pill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deltalake>=1.6.3",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.1",
    "pyspark>=4.2.0",
    "pandas>=3.0.5",
    "polars-sha",
    "pyiceberg[sql-sqlite]>=0.12.0", # >=0.12 rejects the broken pydantic 2.12.0/2.12.1 itself
]

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "notebook>=7.4.3",
    "ruff>=0.11.11",
]
cpu_polars = [
    "polars==2.0.0"
]

gpu_polars = [
    # Held at 1.42.1 while cpu_polars is on 2.x (docs/adr/0003): no cudf-polars release supports polars 2.
    "polars[gpu]==1.42.1",
    "cudf-polars-cu12>=26.8.1"
]

[tool.uv]
# Packages have to non-conflict to uv create the correct lock.
conflicts = [
    [
        {group = "cpu_polars"},
        {group = "gpu_polars"}
    ] 
]

[tool.uv.sources]
polars-sha = { path = "polars_sha/target/wheels/polars_sha-0.1.0-cp39-abi3-manylinux_2_34_x86_64.whl" }

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
