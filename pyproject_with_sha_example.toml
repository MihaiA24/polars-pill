[project]
name = "polars-pill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.9"
dependencies = [
    "deltalake>=1.0.2",
    "duckdb>=1.3.0",
    "pyarrow>=21.0.0",
    "pyspark>=4.0.0",
    "pandas>=2.2.3",
    "polars-sha",
]

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "notebook>=7.4.3",
    "ruff>=0.11.11",
]
cpu_polars = [
    "polars>1.31.0"
]

gpu_polars = [
    "polars[gpu]>=1.31.0"
]

[tool.uv]
# Packages have to non-conflict to uv create the correct lock.
conflicts = [
    [
        {group = "cpu_polars"},
        {group = "gpu_polars"}
    ] 
]

[tool.uv.sources]
polars-sha = { path = "polars_sha/target/wheels/polars_sha-0.1.0-cp39-abi3-manylinux_2_34_x86_64.whl" }

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
